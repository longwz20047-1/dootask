# P0 Security: restrict /api/wecom/internal/generate_token to Docker internal services only
#
# This endpoint bypasses user login (uses X-Internal-Secret instead), so we must also
# block public access at the network layer.
#
# Source IP patterns observed via `docker logs dootask-nginx-*` access log:
#   172.29.0.1   — Docker bridge gateway (AgentStudio backend container -> dootask-nginx)
#   127.0.0.1    — localhost curl (server-side testing only)
#   192.168.100.240 — 宝塔 reverse proxy (公网入口, MUST be blocked)
#   119.x.x.x    — raw internet (blocked via 宝塔 anyway, double-check here)
#
# `location =` is an EXACT match in nginx (higher priority than the catch-all `location /`),
# so we must explicitly fallback to @laravels after the ACL passes.

location = /api/wecom/internal/generate_token {
    allow 172.29.0.0/16;   # Docker bridge network (AgentStudio backend)
    allow 127.0.0.1;       # localhost (server-side diagnostic curl only)
    deny  all;             # everything else (宝塔反代 + 公网)

    # ACL passed → hand over to Laravel Swoole exactly like the default location does.
    try_files $uri @laravels;
}
